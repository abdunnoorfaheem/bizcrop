<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="src/output.css" rel="stylesheet">

</head>
<body>
   <div class="max-w-[1280px] mx-auto ">
       <div class="lg:flex mt-3 mb-8 items-center lg:mx-0 mx-3">
      <div class="lg:w-1/5 w-full">
         <div class="flex mb-4 lg:mb-0 lg:justify-start justify-between items-center lg:gap-x-4 gap-x-1">
         <div class="bg-[#F3F3F3] lg:h-10 h-5 w-5 cursor-pointer lg:w-10 flex justify-center items-center">
            <i class="fa-solid fa-bars lg:text-[18px] text-[12px]"></i>
        </div>
        <div class="bg-[#F3F3F3] lg:py-2.5 py-1 pl-2 pr-1 lg:pl-5 lg:pr-2.5">
            <select class="pr-1 text-[#110D0A] cursor-pointer font-medium  lg:text-[16px] text-[10px] outline-0" name="" id="">
                <option class="text-[#110D0A] lg:font-medium lg:text-[16px] text-[10px]" value="">All DEPARTMENTS</option>
            </select>
        </div>
       </div>
      </div>
      <div class="lg:w-4/5 w-full">
        <div class="relative flex items-center">
            <input class="lg:py-[9px] py-[5px] pl-5 w-[90%] lg:text-[16px] text-[12px] outline-0 border-2 border-[#E7E7E7]" type="text" placeholder="Search...">
            <select name="" id="" class="absolute cursor-pointer text-[#757575]  top-0 lg:mt-[10px] mt-[6px] outline-0 lg:right-27 right-11 lg:pl-5 pl-2 pr-1 border-l-2 border-[#757575] lg:text-[16px] text-[12px]">
                <option class="text-[#757575] lg:text-[16px] text-[12px]" value="">All Category</option>
            </select>
            <h5 class="lg:px-[38px] lg:py-[10px] px-[10px] py-[3.5px] bg-black cursor-pointer">
                <i class="fa-solid fa-magnifying-glass lg:text-[22px] text-[16px] font-normal text-white"></i>
            </h5>
        </div>
      </div>
       </div>
   </div>
</body>
</html>
