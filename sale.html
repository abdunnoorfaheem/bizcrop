<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="src/output.css">
</head>
<body class="bg-white text-gray-800">

  <!-- 🔹 Banner Section -->
  <div class="max-w-[1280px] mx-auto px-4 py-10 grid grid-cols-1 md:grid-cols-2 gap-6">
    
    <!-- Left Card -->
    <div class="relative bg-cover bg-center h-[300px] sm:h-[340px] lg:h-[400px] flex items-center justify-start p-6 sm:p-8 rounded-xl overflow-hidden"
         style="background-image: url('./src/assets/img one.png')">
      <div class="bg-white/70 backdrop-blur-sm p-6 sm:p-8 max-w-[250px] rounded-lg">
        <p class="text-xs sm:text-sm text-gray-600 uppercase">Sale up to 25%</p>
        <h2 class="text-xl sm:text-2xl font-bold text-gray-900 mt-2 leading-snug">
          It’s In The Bag:<br>Limited Deals
        </h2>
        <button class="mt-4 bg-black text-white px-4 sm:px-5 py-2 text-xs sm:text-sm font-semibold hover:bg-gray-800 transition">
          Shop Now
        </button>
      </div>
    </div>

    <!-- Right Card -->
    <div class="relative bg-cover bg-center h-[300px] sm:h-[340px] lg:h-[400px] flex items-center justify-start p-6 sm:p-8 rounded-xl overflow-hidden"
         style="background-image: url('./src/assets/img two.png')">
      <div class="bg-white/70 backdrop-blur-sm p-6 sm:p-8 max-w-[250px] rounded-lg">
        <p class="text-xs sm:text-sm text-gray-600 uppercase">Sale up to 25%</p>
        <h2 class="text-xl sm:text-2xl font-bold text-gray-900 mt-2 leading-snug">
          Make A Statement<br>This Season
        </h2>
        <button class="mt-4 bg-black text-white px-4 sm:px-5 py-2 text-xs sm:text-sm font-semibold hover:bg-gray-800 transition">
          Shop Now
        </button>
      </div>
    </div>

  </div>

  <!-- 🔹 Features Section -->
  <section class="max-w-[1280px] mx-auto px-4 sm:px-6 py-12 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 sm:gap-8 text-center">
    
    <!-- Free Shipping -->
    <div class="group flex flex-col items-center space-y-3 p-6 border rounded-xl shadow-sm hover:shadow-lg transition-all duration-300 hover:-translate-y-2 bg-white">
      <img src="./src/assets/truck.png" alt="Free Shipping" class="w-12 sm:w-14 group-hover:scale-110 transition-transform duration-300">
      <h3 class="text-base sm:text-lg font-semibold">Free Shipping</h3>
      <p class="text-gray-600 text-sm sm:text-base">For all Orders Over $100</p>
    </div>

    <!-- Secured Payment -->
    <div class="group flex flex-col items-center space-y-3 p-6 border rounded-xl shadow-sm hover:shadow-lg transition-all duration-300 hover:-translate-y-2 bg-white">
      <img src="./src/assets/credit.png" alt="Secured Payment" class="w-12 sm:w-14 group-hover:scale-110 transition-transform duration-300">
      <h3 class="text-base sm:text-lg font-semibold">Secured Payment</h3>
      <p class="text-gray-600 text-sm sm:text-base">Payment Cards Accepted</p>
    </div>

    <!-- 30 Days Returns -->
    <div class="group flex flex-col items-center space-y-3 p-6 border rounded-xl shadow-sm hover:shadow-lg transition-all duration-300 hover:-translate-y-2 bg-white">
      <img src="./src/assets/gift.png" alt="30 Days Returns" class="w-12 sm:w-14 group-hover:scale-110 transition-transform duration-300">
      <h3 class="text-base sm:text-lg font-semibold">30 Days Returns</h3>
      <p class="text-gray-600 text-sm sm:text-base">For an Exchange Product</p>
    </div>

    <!-- 24/7 Support -->
    <div class="group flex flex-col items-center space-y-3 p-6 border rounded-xl shadow-sm hover:shadow-lg transition-all duration-300 hover:-translate-y-2 bg-white">
      <img src="./src/assets/customer.png" alt="24/7 Support" class="w-12 sm:w-14 group-hover:scale-110 transition-transform duration-300">
      <h3 class="text-base sm:text-lg font-semibold">24/7 Support</h3>
      <p class="text-gray-600 text-sm sm:text-base">Contact us Anytime</p>
    </div>

  </section>

</body>
</html>
